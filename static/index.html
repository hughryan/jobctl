<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jobctl</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #eee; } }
  h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid rgba(128,128,128,0.25); vertical-align: top; }
  th { font-weight: 600; opacity: 0.7; }
  tr.job-row { cursor: pointer; }
  tr.job-row:hover { background: rgba(128,128,128,0.08); }
  .status { padding: 0.1rem 0.5rem; border-radius: 0.7rem; font-size: 0.75rem; display: inline-block; }
  .status.running { background: #2e7d3222; color: #2e7d32; }
  .status.exited { background: #6c757d22; color: #6c757d; }
  .status.stopped { background: #c6280022; color: #c62800; }
  .status.stopping { background: #b8860022; color: #b86000; }
  .status.paused { background: #1565c022; color: #1565c0; }
  .status.queued { background: #5c6bc022; color: #5c6bc0; }
  .cmd { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.8rem; opacity: 0.85; }
  button { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 0.4rem; border: 1px solid rgba(128,128,128,0.4); background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: rgba(128,128,128,0.15); }
  #controls { margin-bottom: 0.75rem; }
  pre.log { background: rgba(128,128,128,0.08); padding: 0.75rem; border-radius: 0.4rem; max-height: 320px; overflow: auto; font-size: 0.78rem; white-space: pre-wrap; word-break: break-word; }
  .empty { opacity: 0.6; font-style: italic; padding: 1rem 0; }
</style>
</head>
<body>
<h1>jobctl — running &amp; recent jobs</h1>
<div id="controls"><button id="show-all" style="display:none"></button></div>
<table id="jobs">
  <thead><tr><th>ID</th><th>Status</th><th>Runtime</th><th>Command</th><th>CWD</th><th></th></tr></thead>
  <tbody id="jobs-body"></tbody>
</table>
<div id="empty" class="empty" style="display:none">No jobs yet.</div>

<script>
const RECENT_WINDOW_SECS = 24 * 60 * 60;
const CMD_MAX_CHARS = 100;
const ACTIVE_STATUSES = ['running', 'stopping', 'paused', 'queued'];

const expanded = new Set();
let showAll = false;

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);
}

function isActive(j) {
  return ACTIVE_STATUSES.includes(j.status);
}

/** Active jobs always show, however old; everything else only within the recency window. */
function isRecent(j) {
  // A job stopped while still queued never started, so it is placed by when it was queued.
  const start = j.started_at || j.queued_at || 0;
  return isActive(j) || start >= (Date.now() / 1000) - RECENT_WINDOW_SECS;
}

function fmtCmd(cmd) {
  const oneLine = cmd.join(' ').trim().split(/\s+/).join(' ');
  return oneLine.length > CMD_MAX_CHARS ? oneLine.slice(0, CMD_MAX_CHARS) + '…' : oneLine;
}

/** Seconds spent paused, including an interval still open — never counted as runtime. */
function pausedSecs(j) {
  const total = j.paused_secs || 0;
  return total + (j.paused_at ? (Date.now() / 1000) - j.paused_at : 0);
}

function fmtDuration(secs) {
  secs = Math.floor(secs);
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
  if (h) return `${h}h${m}m`;
  if (m) return `${m}m${s}s`;
  return `${s}s`;
}

async function fetchJobs() {
  const res = await fetch('/api/jobs');
  return res.json();
}

async function fetchLog(id) {
  const res = await fetch(`/api/jobs/${id}/log?tail=300`);
  return res.text();
}

async function stopJob(id) {
  await fetch(`/api/jobs/${id}/stop`, { method: 'POST' });
  render();
}

function toggle(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  render();
}

function toggleShowAll() {
  showAll = !showAll;
  render();
}

async function render() {
  const all = await fetchJobs();
  const recent = all.filter(isRecent);
  const jobs = showAll ? all : recent;
  const hidden = all.length - recent.length;
  const body = document.getElementById('jobs-body');
  const empty = document.getElementById('empty');
  const showAllBtn = document.getElementById('show-all');
  body.innerHTML = '';

  showAllBtn.style.display = (showAll || hidden > 0) ? 'inline-block' : 'none';
  showAllBtn.textContent = showAll ? 'Show recent' : `Show all (${all.length})`;

  empty.style.display = jobs.length ? 'none' : 'block';
  empty.textContent = all.length
    ? `No jobs started in the last 24 hours — use “Show all (${all.length})” to see older jobs.`
    : 'No jobs yet.';

  for (const j of jobs) {
    const end = j.ended_at || (Date.now() / 1000);
    const tr = document.createElement('tr');
    tr.className = 'job-row';
    tr.onclick = () => toggle(j.id);
    tr.innerHTML = `
      <td>${escapeHtml(j.id)}</td>
      <td><span class="status ${escapeHtml(j.status)}">${escapeHtml(j.status)}</span></td>
      <td>${j.started_at == null ? '-' : fmtDuration(end - j.started_at - pausedSecs(j))}</td>
      <td class="cmd">${escapeHtml(fmtCmd(j.cmd))}</td>
      <td class="cmd">${escapeHtml(j.cwd || '')}</td>
      <td>${isActive(j) ? `<button data-stop="${escapeHtml(j.id)}">Stop</button>` : ''}</td>
    `;
    body.appendChild(tr);

    const stopBtn = tr.querySelector('[data-stop]');
    if (stopBtn) stopBtn.onclick = (e) => { e.stopPropagation(); stopJob(j.id); };

    if (expanded.has(j.id)) {
      const logRow = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 6;
      const pre = document.createElement('pre');
      pre.className = 'log';
      pre.textContent = await fetchLog(j.id);
      td.appendChild(pre);
      logRow.appendChild(td);
      body.appendChild(logRow);
    }
  }
}

document.getElementById('show-all').onclick = toggleShowAll;
render();
setInterval(render, 2000);
</script>
</body>
</html>
